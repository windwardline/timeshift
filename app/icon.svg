<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The terminator: day advancing across the night disc, the day/night
       boundary TimeShift plots for every itinerary. Palette tokens night-1,
       day, day-2, dawn, violet-2, text from app/globals.css. -->
  <style>
    .rim{stroke:none}
    @media (prefers-color-scheme:dark){.rim{stroke:#9d7cff;stroke-opacity:.5;stroke-width:1.25}}
  </style>
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffb23e"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="14" fill="#0b1026"/>
  <path d="M16 2 A14 14 0 0 1 16 30 A5 14 0 0 1 16 2 Z" fill="url(#day)"/>
  <path d="M16 2 A5 14 0 0 0 16 30" fill="none" stroke="#ff5c7a" stroke-width="1.1" stroke-opacity=".85"/>
  <circle cx="9.2" cy="10.2" r="1.15" fill="#eceeff"/>
  <path class="rim" d="M16 2 A14 14 0 0 0 16 30" fill="none"/>
</svg>
